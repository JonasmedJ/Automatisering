- name: Wait for VM to be reachable
  ansible.builtin.wait_for:
    host: "{{ item.ip }}"
    port: 22
    delay: 10
    timeout: 60
  delegate_to: localhost
  loop: "{{ pve_vm_vms }}"

- name: Set Danish keyboard layout
  ansible.builtin.command: localectl set-keymap dk
  delegate_to: "{{ item.ip }}"
  become: true
  loop: "{{ pve_vm_vms }}"
  vars:
    ansible_user: "{{ rocky_user }}"
    ansible_become_pass: "{{ default_password }}"
  tags: skip_ansible_lint

- name: Set Danish Timezone
  ansible.builtin.command: timedatectl set-timezone Europe/Copenhagen
