---
# defaults file for roles/httpd

httpd_domain_port: 80

httpd_domain_ssl_port: 443

httpd_reversed_domain: "{{ httpd_domain_name.split('.') | reverse | join('.') }}"

httpd_base_domain: "{{ httpd_domain_name | regex_replace('^www\\.', '') }}"

httpd_db_host: "{{ pve_ip_mariadb }}"
