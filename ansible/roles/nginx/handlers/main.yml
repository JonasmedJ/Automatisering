---
# handlers file for roles/nginx

- name: Firewall_reload
  ansible.builtin.systemd:
    name: firewalld
    state: reloaded

- name: SELinux_httpd
  ansible.posix.seboolean:
    name: httpd_can_network_connect
    state: true
    persistent: true

- name: Nginx_reload
  ansible.builtin.systemd:
    name: nginx
    state: reloaded

- name: Nginx_restart
  ansible.builtin.command:
    cmd: nginx -s reload
  tags:
    - skip_ansible_lint
