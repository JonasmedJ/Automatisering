---

# Opsætning til Ansible script (IP'er, hostnames osv) (handlers til DNS?)
- name: Setup Roles and Plays for LAMP Stack
  hosts: localhost
  become: true

  vars_prompt:

    # Variables for DNS Server
    - name: binddns_dns_domain
      prompt: "Enter the domain for the DNS"
      private: false
      default: "domain.example"

    - name: binddns_dns_network
      prompt: "Enter the network address"
      private: false
      default: "192.168.0.0"

    # Variables for MariaDB Database
    - name: mariadb_db_name
      prompt: " Input a name for the new database"
      private: false
      default: "{{ mariadb_db_name }}"

    - name: mariadb_db_username
      prompt: " Choose a username for the new database"
      private: false
      default: "{{ mariadb_db_username }}"

    - name: mariadb_db_password
      prompt: " Select a password for the user"
      private: false
      default: "{{ mariadb_db_password }}"

    # Variables for Apache webserver
    # Sets a domain admin, this user can/should also be used for SFTP setup
    - name: httpd_domain_admin
      prompt: " Enter the username for the domain admin"
      private: false
      default: "{{ httpd_domain_admin }}"

    # Set password required for SFTP service later on, by the remote admin.
    - name: httpd_domain_admin_password
      prompt: " Enter the password you want for SFTP"
      private: true
      confirm: true

    # Sets a domain name for the service
    - name: httpd_domain_name
      prompt: "Enter the domain name"
      private: false
      default: "{{ httpd_domain_name }}"

    # Set DB username from the database. Or comment out and change in /roles/vars/main.yml
    - name: httpd_db_username
      prompt: " Enter the username for the DB user"
      private: false
      default: "{{ httpd_db_username }}"

    # Set DB password from the database. Or comment out and change in /roles/vars/main.yml
    - name: httpd_db_password
      prompt: " Enter the password for the DB"
      private: false
      default: "{{ httpd_db_password }}"

    - name: httpd_db_name
      prompt: " Enter the database name"
      private: false
      default: "{{ httpd_db_name }}"

  vars:
    binddns_dns_reverse_zone: >-
      {{ binddns_dns_network.split('.')[:3] | reverse | join('.') }}.in-addr.arpa

  roles:
    - binddns
    - mariadb
    - httpd
    - nginx
