---

# ============================================================
# LAMP Stack Setup
# ============================================================

- name: Prompt user to confirm all.yml is configured
  hosts: localhost
  tasks:
    - name: Ask user if all.yml is configured
      ansible.builtin.pause:
        prompt: "Have you configured group_vars/all.yml with the correct values?"

- name: Provision Proxmox VMs
  hosts: proxmoxhosts
  roles:
    - pve_vm

- name: Wait for VMs to be ready
  hosts: dns_servers, dbservers, webservers, nginxservers
  gather_facts: false
  tasks:
    - name: Wait for SSH to become available
      ansible.builtin.wait_for_connection:
        delay: 10
        timeout: 120

- name: Configure DNS
  hosts: dns_servers
  become: true
  roles:
    - binddns

- name: Configure Database
  hosts: dbservers
  become: true
  roles:
    - mariadb

- name: Configure Webserver
  hosts: webservers
  become: true
  roles:
    - httpd

- name: Configure Reverse Proxy
  hosts: nginxservers
  become: true
  roles:
    - nginx
